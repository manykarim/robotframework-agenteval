# release.yml — NFR-MAINT-03 tagged release via PyPI OIDC trusted publishing
#
# Purpose: On semver-tag push (v[0-9]+.[0-9]+.[0-9]+*), builds wheel + sdist via
# `uv build` and publishes to PyPI via `uv publish` using OIDC trusted publishing
# (no PYPI_TOKEN secret).
#
# AC reference: AC-1a.2.7 (release.yml), AC-1a.2.9 (workflow hygiene).
# NFR reference: NFR-MAINT-03 (PyPI OIDC trusted publishing + semver tags).
#
# Dry-run mechanic:
# - Until the PyPI project exists + the trusted-publisher claim is configured,
#   `uv publish` would 401. The dry-run mechanic below skips `uv publish` unless
#   the `TRUSTED_PUBLISHER_CONFIGURED` repo variable is set to `true` (a repo-
#   level Actions variable the owner flips when the PyPI claim is registered).
#
# PyPI Trusted Publishers setup: https://docs.pypi.org/trusted-publishers/
#   The PyPI project owner adds a trusted-publisher entry that names:
#     - PyPI project: robotframework-agenteval
#     - GitHub repo: manykarim/robotframework-agenteval
#     - workflow filename: release.yml
#     - environment name: (none, or "release" if you add `environment:` here)
#   Once configured, set repo variable TRUSTED_PUBLISHER_CONFIGURED=true to flip
#   this workflow from dry-run to live publish.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch: {}

permissions:
  # id-token: write is REQUIRED for PyPI OIDC trusted publishing — without it,
  # the JWT exchange fails and `uv publish` falls back to PYPI_TOKEN (which we
  # explicitly don't use per NFR-MAINT-03).
  id-token: write
  # contents: write is REQUIRED for the GitHub Release step to create the release
  # and upload the built wheel/sdist as assets on the tag.
  contents: write

jobs:
  release:
    name: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set Python version
        run: echo "3.12" > .python-version

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build wheel + sdist
        run: |
          uv build
          ls -la dist/

      # HIGH-3 fix (2026-05-17): publish is GATED on tag ref. workflow_dispatch
      # from non-tag refs (main, branches) builds but does NOT publish, even
      # after TRUSTED_PUBLISHER_CONFIGURED flips true. Prevents accidental
      # publish of untagged builds (e.g., main HEAD) to PyPI.
      - name: Publish to PyPI (OIDC trusted publishing — tag-gated)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TRUSTED_PUBLISHER_CONFIGURED: ${{ vars.TRUSTED_PUBLISHER_CONFIGURED }}
        run: |
          if [ "${TRUSTED_PUBLISHER_CONFIGURED:-}" != "true" ]; then
            echo "::warning::Dry-run: PyPI OIDC claim not yet configured."
            echo "::warning::Set repo variable TRUSTED_PUBLISHER_CONFIGURED=true after Story 9.1 registers the PyPI trusted-publisher claim."
            echo "::notice::Built artifacts:"
            ls -la dist/
            exit 0
          fi
          uv publish

      - name: Non-tag dispatch — smoke build only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::notice::Smoke build complete; publish skipped (ref ${{ github.ref }} is not a tag)."
          echo "::notice::Built artifacts:"
          ls -la dist/

      # D5 (prepare-v0-1-0-release): cut the GitHub Release for the tag with
      # notes derived from the matching CHANGELOG.md section and the built
      # wheel + sdist attached. Marked a pre-release (Alpha). Runs even in the
      # PyPI dry-run case so the GitHub Release still lands. Requires
      # contents: write (declared at the workflow permissions block).
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Strip the leading 'v' to match the '## [X.Y.Z]' changelog heading.
          version="${TAG#v}"

          # Extract the changelog section for this version: everything between the
          # '## [X.Y.Z]' heading (any trailing date/dash suffix) and the next
          # top-level '## ' heading.
          notes_file="$(mktemp)"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            echo "::warning::No CHANGELOG.md section found for [$version]; releasing with a generated note."
            printf 'Release %s\n' "$TAG" > "$notes_file"
          fi

          echo "::notice::GitHub Release notes for $TAG:"
          cat "$notes_file"

          # Create the pre-release (Alpha) with the built artifacts attached.
          # `gh release create` is idempotent-guarded: if the release already
          # exists, upload/overwrite the assets and refresh the notes instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file "$notes_file" \
              --prerelease
            gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "$TAG" \
              dist/*.whl dist/*.tar.gz \
              --title "$TAG" \
              --notes-file "$notes_file" \
              --prerelease
          fi
