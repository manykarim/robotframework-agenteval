# ci.yml — PR-gating CI workflow
#
# Purpose: Runs on every PR + push to main. Gates merges on lint, format, typecheck,
# and (Phase-1) collect-only pytest invocations across unit + acceptance-smoke +
# acceptance-tier1 + unit/conventions test directories.
#
# AC reference: AC-1a.2.1 (ci.yml), AC-1a.2.9 (workflow hygiene), AC-1a.2.10 (no agentguard-drift-check.yml).
#
# Phase-1 placeholders documented per Dev Notes:
# - `pytest --collect-only` is used for all test directories because Story 1a.1 produced empty
#   tests/ directories (only .gitkeep + __init__.py). Running `pytest tests/unit -q` against an
#   empty dir yields exit-code-5 "no tests collected" which would fail CI red. `--collect-only`
#   exits 0 on empty dirs AND 0 on real test discovery — it's the right Phase-1 placeholder.
#   Each epic's first story that adds real tests MUST update this YAML to drop --collect-only.
#
# Linux-only matrix per D2.1 architect waiver (Story 0.2 review, 2026-05-17): macOS validation
# is a Phase-1.5 carry-over. Architecture's `Python 3.12+3.13 × Linux+macOS` is the eventual
# target; Phase-1 ships Linux-only and documents the gap.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set Python version
        run: echo "${{ matrix.python-version }}" > .python-version

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff format --check)
        run: uv run ruff format --check src/ tests/

      - name: Typecheck (mypy)
        run: uv run mypy src/

      # Story 1a.5 deliverable — defense-in-depth: pre-commit hook
      # (.pre-commit-config.yaml) catches local commits; this step catches
      # `git commit --no-verify` bypass. Both gates active.
      - name: License headers check (Apache 2.0)
        run: uv run python scripts/check-license-headers.py

      # Story 14.2 deliverable — defense-in-depth: pre-commit hook
      # (.pre-commit-config.yaml) catches local commits; this step catches
      # `git commit --no-verify` bypass. Mode B (--all-tracked) scans every
      # tracked file for DF-X.Y-SZ refs missing catalog rows.
      - name: Catalog references check (Phase-1.5)
        run: uv run python scripts/check-catalog-references.py --all-tracked

      # Contract-doc + keyword-count doc gates (also in docs-build.yml; run here
      # so a PR that breaks them fails fast).
      - name: Contract sections check
        run: uv run python scripts/check-contract-sections.py

      - name: Doc keyword-count check
        run: uv run python scripts/check_doc_keyword_count.py

      # The full Python suite: the _core spine unit tests + the four surface
      # libraries' tests (tests/unit/core + tests/surfaces).
      - name: pytest (unit + surfaces)
        run: uv run pytest tests/ -q

      # End-to-end .robot smoke suites: each of the four libraries imported on
      # its own + the AgentEval composite, run as real Robot Framework libraries.
      - name: robot smoke suites (tests/robot)
        run: uv run robot --output NONE --report NONE --log NONE tests/robot
