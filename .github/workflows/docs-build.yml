# docs-build.yml — NFR-MAINT-04 docs-build with section-presence enforcement
#
# Purpose: Builds RF libdoc + asserts every doc in docs/contracts/ contains the
# 4 architecture-mandated section headers: ## Purpose / ## Scope / ## Contract /
# ## Change Policy.
#
# AC reference: AC-1a.2.6 (docs-build.yml), AC-1a.2.9 (workflow hygiene).
# NFR reference: NFR-MAINT-04 (10 docs as first-class — section-presence enforcement).
#
# Phase-1 mechanic: grep-based section-presence check is the minimum-viable
# NFR-MAINT-04 enforcement. Full RF libdoc generation across populated keyword
# files lands when Epic 1b + later epics add real RF Library classes. Replacing
# grep with a richer libdoc-generated checker is a Phase-2 follow-up.
#
# Edge case: docs/contracts/ may be empty in Phase 1 (Story 1a.4 fills it).
# Workflow emits `::notice::` + exits 0 when the directory has no .md files.

name: docs-build

on:
  workflow_dispatch: {}
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "src/AgentEval/**/*.py"
      - "src/HooksLibrary/**/*.py"
      - "src/MCPLibrary/**/*.py"
      - "src/SkillsLibrary/**/*.py"
      - "src/SubagentsLibrary/**/*.py"
      - "README.md"
      - "scripts/check_doc_keyword_count.py"
      - "scripts/check-doc-rendering.py"

permissions:
  contents: read

jobs:
  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set Python version
        run: echo "3.12" > .python-version

      - name: Install dependencies
        run: uv sync --all-extras

      # D4 (prepare-v0-1-0-release): sweep ALL FIVE shipped packages via
      # pkgutil.walk_packages instead of only AgentEval. The four top-level
      # surface libraries (HooksLibrary, MCPLibrary, SkillsLibrary,
      # SubagentsLibrary) plus the AgentEval spine are import-walked so a broken
      # import in ANY shipped surface library fails the docs build — not only a
      # break under AgentEval.*.
      - name: Sweep-import all shipped AgentEval packages
        run: |
          uv run python -c "
          import importlib
          import pkgutil
          import sys

          import AgentEval
          import HooksLibrary
          import MCPLibrary
          import SkillsLibrary
          import SubagentsLibrary

          packages = [
              AgentEval,
              HooksLibrary,
              MCPLibrary,
              SkillsLibrary,
              SubagentsLibrary,
          ]

          failures = []
          modules_imported = 0
          for package in packages:
              prefix = package.__name__ + '.'
              # Import the top-level package itself (walk_packages only yields
              # sub-modules, so a bare 'import Pkg' would otherwise be uncounted).
              modules_imported += 1
              for module_info in pkgutil.walk_packages(package.__path__, prefix=prefix):
                  try:
                      importlib.import_module(module_info.name)
                      modules_imported += 1
                  except Exception as exc:
                      failures.append((module_info.name, type(exc).__name__, str(exc)))

          print(f'AgentEval {AgentEval.__version__} — swept 5 shipped packages, {modules_imported} modules imported cleanly')
          if failures:
              print('::error::Submodule import failures:')
              for name, exc_type, msg in failures:
                  print(f'  - {name}: {exc_type}: {msg}')
              sys.exit(1)
          "

      # Keyword-count drift gate: derive the true unique keyword count from
      # libdoc and assert README.md + docs/index.md state the same number.
      # Fails the build when a new keyword ships without the docs being updated.
      - name: Assert documented keyword counts match libdoc
        run: uv run python scripts/check_doc_keyword_count.py

      # D3 (prepare-v0-1-0-release): machine-check that the generated docs render
      # correctly — well-formed HTML libdoc tables, well-formed README/index
      # markdown tables, resolvable internal links, and the five expected libdoc
      # files present + non-empty. "Render correctly" must be repeatable, not a
      # one-time manual look.
      - name: Assert generated docs render correctly
        run: uv run python scripts/check-doc-rendering.py

      # MED-3 fix (2026-05-17): per-file 4-distinct-section assertion instead of
      # aggregate header count. Previous implementation summed header occurrences
      # across all files which allowed false-pass: a file with 2x ## Purpose +
      # missing ## Contract would still pass if another file had a 5th header.
      - name: Assert NFR-MAINT-04 per-file section presence in docs/contracts/
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d docs/contracts ]; then
            echo "::warning::docs/contracts/ directory missing — Story 1a.4 creates it"
            exit 0
          fi

          mapfile -t files < <(find docs/contracts -maxdepth 1 -name "*.md" -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::Docs-build skipped: docs/contracts/ has no .md files (Phase-1 placeholder; Story 1a.4 fills it)"
            exit 0
          fi

          fail=0
          required_sections=("Purpose" "Scope" "Contract" "Change Policy")
          for f in "${files[@]}"; do
            missing=()
            for section in "${required_sections[@]}"; do
              if ! grep -qE "^## ${section}\$" "$f"; then
                missing+=("## ${section}")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error file=${f}::NFR-MAINT-04 violation: missing required section header(s): ${missing[*]}"
              fail=1
            else
              echo "::notice file=${f}::All 4 NFR-MAINT-04 sections present"
            fi
          done

          if [ "$fail" -eq 1 ]; then
            echo "::error::Each contract doc MUST contain: ## Purpose, ## Scope, ## Contract, ## Change Policy"
            exit 1
          fi
          echo "::notice::NFR-MAINT-04 per-file section-presence assertion passed for ${#files[@]} file(s)"
