# dogfood-integration.yml — NFR-REL-05 cross-repo dogfood smoke check (Phase-1)
#
# Purpose: Per-release per NFR-REL-05, verifies the locally-built agenteval wheel
# installs cleanly into a fresh venv. Phase-1 scope is intentionally limited to
# install-smoke — real cross-repo integration (running rf-mcp +
# robotframework-agentskills test suites against the wheel) is gated on those
# repos actually adopting agenteval as a dependency, which happens in
# Story 9.1 + 9.2.
#
# AC reference: AC-1a.2.5 (dogfood-integration.yml), AC-1a.2.9 (workflow hygiene).
# NFR reference: NFR-REL-05 (dogfood integration).
#
# IMPORTANT — why Phase-1 is smoke-only (lesson learned 2026-05-17):
# Story 1a.2's first implementation cloned rf-mcp + robotframework-agentskills
# and ran THEIR pytest against ONLY the agenteval wheel installed in a clean
# venv. The downstream tests crashed at import time (ModuleNotFoundError on
# their own deps + own package) and `continue-on-error: true` masked the
# failures as success. That was fake-green CI — the workflow looked green but
# validated nothing. Honest framing: until rf-mcp + robotframework-agentskills
# actually import agenteval, there's nothing to dogfood. Story 9.1 + 9.2 close
# this gap. Until then, install-smoke is the truthful Phase-1 baseline.
#
# Trigger: release published, workflow_dispatch, AND PRs with the release-pending
# label. The label gate is enforced via an `if:` job-level expression.

name: dogfood-integration

on:
  workflow_dispatch: {}
  release:
    types: [published]
  pull_request:
    types: [labeled, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  dogfood:
    name: dogfood-integration (Phase-1 smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Phase-1: only run on PRs that explicitly carry the release-pending label.
    # release + workflow_dispatch always pass this gate.
    if: >
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'release-pending'))

    steps:
      - name: Checkout agenteval
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set Python version
        run: echo "3.12" > .python-version

      # MED-6 fix (2026-05-17): AC-1a.2.5 spec text requires uv sync --all-extras
      # before uv build. Original implementation skipped this.
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build agenteval wheel
        run: |
          uv build
          ls -la dist/

      # Phase-1 honest smoke check: install the locally-built wheel into a clean
      # venv. If this fails, the wheel is broken and downstream consumers can't
      # use it. That's a real NFR-REL-05 signal. Real cross-repo testing waits
      # for Story 9.1 + 9.2.
      - name: Smoke check — agenteval wheel installs into clean venv
        run: |
          set -euo pipefail
          mkdir -p /tmp/dogfood-smoke
          cd /tmp/dogfood-smoke
          uv venv
          source .venv/bin/activate
          uv pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python -c "import AgentEval; print(f'Smoke OK: AgentEval {AgentEval.__version__} installed cleanly into fresh venv')"

      - name: Phase-1 scope notice
        run: |
          echo "::notice::Phase-1 dogfood-integration is install-smoke ONLY."
          echo "::notice::Real cross-repo testing (rf-mcp + robotframework-agentskills running their suites against the wheel) waits for Story 9.1 + 9.2, when those repos adopt agenteval as a dependency."
          echo "::notice::Until then, there's nothing meaningful to test — running their tests against ONLY the agenteval wheel (no downstream deps) yields ModuleNotFoundError, not a real signal."

  parity-suite-smoke:
    name: rf-mcp parity-suite smoke (Story 9.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Story 9.1 / AC-9.1.3: extends the install-smoke job with a parity-suite
    # smoke check. Runs on workflow_dispatch + release (heavy operation per
    # Story 9.1 D-2) AND on PRs labeled `release-pending` (kilo/minimax
    # cross-LLM review HIGH-2 patch 2026-05-26 — the domestic regression
    # gate was previously untestable on PRs because the trigger excluded
    # `pull_request` entirely; now matches the `dogfood` job's
    # release-pending PR gating pattern).
    if: >
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'release-pending'))

    steps:
      - name: Checkout agenteval
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set Python version
        run: echo "3.12" > .python-version

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Clone rf-mcp at pinned SHA
        run: |
          set -euo pipefail
          # Pinned per parity-checklist-rf-mcp-mcp-surface.md L3.
          RF_MCP_SHA="${{ vars.RF_MCP_PINNED_SHA || '235d679785fd4e5f647e9e760ec7da2a3d09b7ef' }}"
          git clone --depth=50 https://github.com/manykarim/rf-mcp /tmp/rf-mcp
          cd /tmp/rf-mcp
          git checkout "$RF_MCP_SHA"
          echo "RF_MCP_REPO_ROOT=/tmp/rf-mcp" >> "$GITHUB_ENV"

      - name: Install rf-mcp dependencies
        run: |
          cd /tmp/rf-mcp
          uv sync

      - name: Run agenteval rf-mcp parity suite
        env:
          RF_MCP_REPO_ROOT: /tmp/rf-mcp
        run: |
          set -euo pipefail
          uv run robot \
            --listener AgentEval.telemetry.listener.Listener \
            --output /tmp/rf-mcp-output.xml \
            --report NONE \
            --log NONE \
            tests/dogfood/rf-mcp/test_mcp_surface_parity.robot \
            tests/dogfood/rf-mcp/test_trace_observability_parity.robot

      - name: Story 9.1 parity-suite smoke status notice
        run: |
          echo "::notice::Story 9.1 parity-suite-smoke job ran the rf-mcp dogfood parity suite against the locally-modified agenteval source."
          echo "::notice::Cross-repo trigger (rf-mcp PRs blocking on agenteval regressions) requires rf-mcp adoption of agenteval — out of scope for this repo per Story 9.1 D-2."

  agentskills-parity-suite-smoke:
    name: agentskills parity-suite smoke (Story 9.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Story 9.2 / AC-9.2.4: agentskills dogfood is self-contained — Story 6.4 +
    # Story 7.4 vendored the necessary skill .md files + task YAMLs INTO this
    # repo (per agenteval's no-upstream-push vendor pattern). No external clone
    # required; the dogfood suites run directly against this repo's tree.
    # Extended 2026-05-26 per kilo/minimax cross-LLM review HIGH-2 patch
    # (Story 9.1 finding propagated to Story 9.2): add `release-pending`
    # PR label trigger so the domestic regression gate is testable on
    # development PRs (was previously workflow_dispatch + release only).
    if: >
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'release-pending'))

    steps:
      - name: Checkout agenteval
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set Python version
        run: echo "3.12" > .python-version

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run agentskills parity suites (metrics + assertions + discoverability)
        run: |
          set -euo pipefail
          uv run robot \
            --listener AgentEval.telemetry.listener.Listener \
            --output /tmp/agentskills-output.xml \
            --report NONE \
            --log NONE \
            tests/dogfood/agentskills/test_metrics_parity.robot \
            tests/dogfood/agentskills/test_assertions_parity.robot \
            tests/dogfood/agentskills/test_skill_discoverability.robot

      - name: Story 9.2 parity-suite smoke status notice
        run: |
          echo "::notice::Story 9.2 agentskills-parity-suite-smoke job ran the agentskills dogfood (metrics + assertions + 3-of-11-skills discoverability)."
          echo "::notice::Live-provider discrimination quality + 8 remaining skills are Phase-2 (DF-7.4-S1 / C60). 7-day monitoring + downstream adoption per DF-9.2-S1 / C66."

  # Story 14.4 deliverable (PARTIAL closure of C70 + Epic 11 retro Action #3+#4
  # + Epic 12 retro Action #4+#8 + Epic 13 retro Action #8):
  #
  # OPERATOR PREREQUISITE 1 — set GitHub repo secrets BEFORE triggering:
  #   - OPENAI_API_KEY              (used by openai_agents_sdk + codex_cli tests)
  #   - ANTHROPIC_API_KEY           (used by claude_agent_sdk + judge + judge_calibrate tests)
  #   - GITHUB_COPILOT_TOKEN        (used by copilot_cli test if available)
  #
  # OPERATOR PREREQUISITE 2 — CLI binaries on $PATH on the runner:
  #   `ubuntu-latest` does NOT ship `codex` / `copilot` / `claude` CLIs. The
  #   3 CLI-backed live tests (codex_cli, copilot_cli, claude_code_cli) will
  #   `pytest.skip(...)` with "binary not found" reasons unless the operator
  #   pre-installs them OR moves this job to a runner image/label that
  #   guarantees them. Per Story 14.4 Codex HIGH-2 + DF-14.4-S1 sub-step (f):
  #   operator-side runner-setup work. C70 (OpenAI Agents SDK shape) evidence
  #   path does NOT depend on a CLI binary (Python SDK only) — that half of
  #   the workflow works on stock ubuntu-latest with just OPENAI_API_KEY.
  #
  # Trigger with: `gh workflow run dogfood-integration.yml` (workflow_dispatch).
  # NEVER runs on PR / release / cron — these tests cost real money and need
  # the secrets above. Failing-because-secrets-missing on PRs would just be
  # noisy red CI (per Story 14.4 D-2 honest framing).
  #
  # Per `feedback_dogfood_fake_green_precheck`: tests that find no creds OR
  # missing CLI binaries SKIP cleanly (pytest.skip(...)) — honest signal, not
  # workflow defect. The aggregate-summary step explicitly flags
  # "0 passed across all live test files" as an operator-misconfiguration
  # signal rather than a green run (Codex MED-3).
  live-integration-tests:
    name: Live integration tests (5+ Phase-2 SDKs/CLIs — operator-triggered, Story 14.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # workflow_dispatch ONLY (per Story 14.4 AC-14.4.1).
    if: github.event_name == 'workflow_dispatch'

    env:
      AGENTEVAL_INTEGRATION_TESTS: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_COPILOT_TOKEN: ${{ secrets.GITHUB_COPILOT_TOKEN }}

    steps:
      - name: Checkout agenteval
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set Python version
        run: echo "3.12" > .python-version

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Detect adapter binary versions (_TESTED_UP_TO drift evidence)
        shell: bash
        run: |
          set +e
          {
            echo "## Detected adapter binary versions"
            echo ""
            echo "| Adapter | Binary | Observed version | _TESTED_UP_TO constant |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          probe() {
            local name="$1"; local bin="$2"; local constant="$3"
            local observed
            # Codex MED-1 fix: `head | true` chain swallows missing-binary errors.
            # Pre-check existence with `command -v` instead.
            if command -v "$bin" >/dev/null 2>&1; then
              observed="$($bin --version 2>&1 | head -1)"
              observed="${observed:-(empty)}"
            else
              observed="NOT FOUND"
            fi
            echo "| $name | \`$bin\` | $observed | $constant |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::$name observed=$observed tested_up_to=$constant"
          }
          probe "codex-cli"        "codex"  "0.133.0"
          probe "copilot-cli"      "copilot" "1.0.54"
          probe "claude-code-cli"  "claude"  "2.1.144"

      - name: Run live integration tests (6 files, serial)
        shell: bash
        run: |
          set +e
          {
            echo ""
            echo "## Live integration test results"
            echo ""
            echo "| Test file | passed | failed | skipped | exit |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          declare -i overall=0
          declare -i total_passed=0
          declare -i total_skipped=0
          run_test() {
            local f="$1"
            local out
            out=$(uv run pytest "$f" -q --tb=short -p no:cacheprovider 2>&1)
            local code=$?
            local passed=$(echo "$out" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | head -1)
            local failed=$(echo "$out" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' | head -1)
            local skipped=$(echo "$out" | grep -oE '[0-9]+ skipped' | grep -oE '[0-9]+' | head -1)
            passed="${passed:-0}"
            failed="${failed:-0}"
            skipped="${skipped:-0}"
            total_passed=$((total_passed + passed))
            total_skipped=$((total_skipped + skipped))
            echo "| \`$(basename "$f")\` | $passed | $failed | $skipped | $code |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then
              overall=1
              echo "::error::$(basename "$f") exit=$code"
              echo "::group::$(basename "$f") output"
              echo "$out"
              echo "::endgroup::"
            else
              echo "::notice::$(basename "$f") OK (exit=$code, passed=$passed, failed=$failed, skipped=$skipped)"
            fi
          }
          run_test tests/integration/test_claude_agent_sdk_live.py
          run_test tests/integration/test_codex_cli_live.py
          run_test tests/integration/test_copilot_cli_live.py
          run_test tests/integration/test_judge_calibrate_live.py
          run_test tests/integration/test_judge_live.py
          run_test tests/integration/test_openai_agents_sdk_live.py
          {
            echo ""
            echo "**Aggregate:** $total_passed passed across all 6 live test files; $total_skipped skipped."
            echo ""
            # Codex MED-3 fix: 0-passed runs are operator-misconfiguration
            # signals, NOT clean green runs. Be explicit so the operator
            # doesn't mistake an all-skipped run for evidence.
            if [ "$total_passed" -eq 0 ]; then
              echo "::warning::0 passed across all live test files — this is most likely an operator-misconfiguration (missing secrets OR missing CLI binaries on \$PATH). NO live evidence has been produced. Review the per-test SKIP reasons in the table above + the run log + ensure OPERATOR PREREQUISITES 1 + 2 (see workflow leading comment) are satisfied before re-triggering."
              echo "**⚠️  No live evidence produced** — all 6 test files SKIPPED or no tests collected. This is NOT a valid C70 / Epic 11+12+13 retro evidence run. See ::warning:: above."
            elif [ "$overall" -eq 0 ]; then
              echo "**Overall:** all live test files exited cleanly (0 or 5 — pytest 'no tests collected' counts as OK)."
            else
              echo "**Overall:** FAIL — at least one live test file exited with a non-zero, non-5 code. See ::error:: annotations + grouped output above."
            fi
            echo ""
            echo "**Operator follow-through (DF-14.4-S1):** record pass counts above in the catalog row + close-out C70 + Epic 11/12/13 retro actions per Story 14.4 AC-14.4.3 evidence-bar. If 0 passed, DO NOT mark C70 done until secrets + runner CLIs are configured + a re-run produces ≥1 passed."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$overall"
