[project]
name = "robotframework-agenteval"
version = "0.5.0"
description = "Robot Framework libraries for testing the agentic stack: MCP servers, Agent Skills, SubAgents, and Hooks - deterministically, with an LLM judge, or with a coding agent."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Many Kasiriha" },
]
keywords = ["robotframework", "ai", "agents", "mcp", "evaluation", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Robot Framework",
  "Framework :: Robot Framework :: Library",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

# Pin discipline (Story 0.1+0.2 spike-validated; AC-1a.1.5 + Epic 0 retro Norm #2):
# - mcp / robotframework / robotframework-pabot / anyio are EXACT-pinned to the spike-validated versions.
#   AdapterVersionDriftWarning (Epic 5 Story 5.2 deliverable per ADR-004 Consequences) will detect
#   future mcp SDK refactors that break the `request_handlers` dict-wrap pattern.
# - litellm / opentelemetry / pyyaml / jsonschema are range-pinned with sane upper-bound caps;
#   Phase 1 stories that exercise them (Epic 4 / Epic 5 / Epic 6) will tighten pins if needed.
# Base install is deliberately tiny — deterministic (Tier-1) testing of all four
# surfaces works with just these. LLM and live-MCP modes live behind extras below,
# so `Library HooksLibrary` pulls nothing heavy.
dependencies = [
  "robotframework==7.4.2",
  "robotframework-pythonlibcore>=4.5",  # DynamicCore, for the optional `Library AgentEval` composite.
  "pyyaml>=6.0,<7.0",
  "jsonschema>=4.0,<5.0",  # MCP Tier-1 tool-schema validation (no live server needed).
]

[project.optional-dependencies]
# Live MCP server testing — the MCP SDK. Tier-1 schema validation does NOT
# need this; Start Server / Connect / Call Tool / List Tools do.
mcp = ["mcp==1.27.1", "anyio==4.13.0"]
# LLM judge (Tier-2) + coding-agent (Tier-3) modes — the LiteLLM adapter.
llm = ["litellm>=1.50,<2.0"]
# In-process pydantic-ai agent adapter (measures MCP/Skills/SubAgents in-process on just an LLM key+base_url).
agent = ["pydantic-ai==2.12.0", "pydantic-ai-harness==0.7.0"]
# Everything.
all = ["robotframework-agenteval[mcp,llm,agent]"]
dev = [
  "robotframework-agenteval[all]",  # dev/CI runs the full test suite (needs mcp + litellm)
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "pre-commit>=3.0,<5.0",
  "playwright>=1.40,<2.0",  # docs-build only: headless-render gate for keyword-doc HTML (browser via `playwright install chromium`)
]

[project.urls]
Homepage = "https://github.com/manykarim/robotframework-agenteval"
Repository = "https://github.com/manykarim/robotframework-agenteval"
Issues = "https://github.com/manykarim/robotframework-agenteval/issues"
# PyPI placeholder — populated when first release publishes.
# PyPI = "https://pypi.org/project/robotframework-agenteval/"

[project.scripts]
agenteval = "AgentEval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/AgentEval",
  "src/HooksLibrary",
  "src/MCPLibrary",
  "src/SkillsLibrary",
  "src/SubagentsLibrary",
  "src/MetricsLibrary",
  "src/StatLibrary",
  "src/AgentLibrary",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/AgentEval",
  "src/HooksLibrary",
  "src/MCPLibrary",
  "src/SkillsLibrary",
  "src/SubagentsLibrary",
  "src/MetricsLibrary",
  "src/StatLibrary",
  "src/AgentLibrary",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]
