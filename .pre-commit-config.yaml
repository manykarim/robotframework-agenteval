# Pre-commit hooks for robotframework-agenteval (Story 1a.5 deliverable).
#
# Install via:
#   uv run pre-commit install
#
# The hooks fire on every `git commit`. The same checks are also enforced
# in CI (.github/workflows/ci.yml) — defense-in-depth: pre-commit catches
# local; CI catches `--no-verify` bypass.
#
# Design choice (Story 1a.5 code-review LOW-9): all hooks use `repo: local`
# + invoke tools via `uv run` so they execute against the project's resolved
# environment (per `pyproject.toml`'s `[dev]` extras and `uv.lock`). This
# prevents version-pin drift between local pre-commit and CI: both run the
# same `uv run ruff` / `uv run mypy` / `uv run python` against the same lock.

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (auto-fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      # Whole-tree `ruff format --check` mirroring ci.yml exactly. The
      # per-file `ruff-format` hook above auto-formats STAGED files; this gate
      # additionally fails on ANY drift across `src/`+`tests/` (incl. unstaged
      # pre-existing drift) so it can never slip through to CI (2026-07-09:
      # these three CI-only gates previously only surfaced at PR time).
      - id: ruff-format-check
        name: ruff format --check (src/ tests/, whole tree)
        entry: uv run ruff format --check src/ tests/
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: mypy
        name: mypy (src/)
        entry: uv run mypy src/
        language: system
        files: ^src/
        pass_filenames: false
        require_serial: true

      - id: license-headers
        name: Apache 2.0 license-header check
        entry: uv run python scripts/check-license-headers.py
        language: system
        files: ^src/AgentEval/.*\.py$
        pass_filenames: false

      # NFR-MAINT-04: every docs/contracts/*.md carries the 4 required
      # sections. Local mirror of the docs-build.yml CI step (added 2026-07-09
      # so the gate runs before commit, not only at PR time).
      - id: contract-sections
        name: NFR-MAINT-04 contract-doc section presence
        entry: uv run python scripts/check-contract-sections.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      # Documented keyword count in README + docs/index.md must match libdoc.
      # Local mirror of the docs-build.yml count-drift CI step.
      - id: doc-keyword-count
        name: doc keyword-count drift check
        entry: uv run python scripts/check_doc_keyword_count.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      # Generated docs must render correctly: libdoc HTML tables well-formed,
      # README + docs/index.md markdown tables balanced, internal links
      # resolve, five expected libdoc files present (design D3,
      # prepare-v0-1-0-release). Local mirror of the docs-build.yml step.
      - id: doc-rendering
        name: doc-rendering validation
        entry: uv run python scripts/check-doc-rendering.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      # Every documented keyword example must reference only real shipped
      # keywords: a namespaced example reference (e.g. `Stat.Run N Times`) that
      # no shipped Library exports is a phantom that never reaches a user.
      - id: keyword-examples
        name: keyword-example phantom-reference check
        entry: uv run python scripts/check-keyword-examples.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
