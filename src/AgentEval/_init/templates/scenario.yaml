# Sample scenario file scaffolded by `agenteval init`.
#
# A scenario describes one or more prompt evaluations to run against an agent.
# Load it with `Load Scenario` (validates only) or execute it with
# `Run Scenario`. Only `evals` is required; every other field is optional.

model: mock/test
provider: mock
agent: generic

# MCP servers this scenario may use, listed by name. The names must match the
# servers you start in your test setup (see example_mcp_runtime.robot).
mcp_servers:
  - bundled-echo

evals:
  - prompt: Say hello to the world
    repeat: 1
    expect:
      response_text_contains: hello
