# agenteval starter config (scaffolded by `agenteval init`).
#
# These values set defaults for the model, fan-out budgets, and where trace
# data is written. Precedence: keyword arguments override environment
# variables, which override this file, which overrides the built-in defaults.
#
# Run your tests with the agenteval listener so trace data and JUnit XML
# enrichment are produced. Use the full `Module.Class` listener path shown
# below (the shorter `AgentEval.telemetry.listener` form does not fire the
# listener hooks):
#
#   robot --listener AgentEval.telemetry.listener.Listener --xunit junit.xml tests/

# Default model used by `Send Prompt` when the keyword call does not override it.
model: mock/test

# Cost budget per test in USD for stochastic fan-out keywords. The run stops
# if a test exceeds it.
max_cost_usd: 5.0

# Runtime budget per test in seconds for stochastic fan-out keywords.
max_runtime_seconds: 300

# Trace backend: `memory` (in-process only, default) or `jsonl` (writes a
# per-test JSONL file under the output directory).
trace_backend: memory
