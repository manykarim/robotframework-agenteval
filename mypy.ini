[mypy]
python_version = 3.12
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
# The spine plus the four surface libraries.
files = src

# Third-party deps without complete stubs — silence mypy until upstream improves.
[mypy-mcp.*]
ignore_missing_imports = True

[mypy-litellm.*]
ignore_missing_imports = True

[mypy-robot.*]
ignore_missing_imports = True

# robotlibcore (DynamicCore) ships no py.typed marker upstream.
[mypy-robotlibcore.*]
ignore_missing_imports = True

# PyYAML / jsonschema ship types separately; silence per-module.
[mypy-yaml.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True
