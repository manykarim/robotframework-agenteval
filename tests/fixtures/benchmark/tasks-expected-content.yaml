# Skill A/B benchmark tasks fixture (add-skill-ab-benchmark unit tests).
# Deterministic `expected_content` grading — no judge/LLM required.
#
# Schema (design D3):
#   tasks: list of task entries
#   each task:
#     id: unique string identifier
#     prompt: natural-language prompt sent to the agent (both arms)
#     exactly one grading mode:
#       expected_content: [<substr>, ...]  (ALL must appear, case-insensitive)
#       rubric: <path.md>                  (judge-graded)

tasks:
  - id: summarize_logs
    prompt: "Summarize the error log and identify the root cause."
    expected_content:
      - "root cause"

  - id: search_docs
    prompt: "Search the knowledge base for the deployment runbook."
    expected_content:
      - "runbook"

  - id: format_table
    prompt: "Render the results as a markdown table."
    expected_content:
      - "table"

  - id: extract_ids
    prompt: "Extract all order ids from the transaction dump."
    expected_content:
      - "order id"
